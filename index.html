

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, "Noto Sans Devanagari", sans-serif;
    color: #202124;
    background: #ffffff;
  }

  header {
    text-align: center;
    padding: 28px 16px 0;
  }

  .logo {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -1px;
    color: #1769e0;
  }

  .logo span {
    color: #188038;
    font-size: 20px;
  }

  header p {
    margin-top: 10px;
    color: #5f6368;
    font-size: 15px;
  }

  main {
    width: min(680px, 100%);
    margin: 95px auto 0;
    padding: 20px;
  }

  h1 {
    text-align: center;
    font-size: clamp(25px, 6vw, 34px);
    font-weight: 500;
    margin-bottom: 14px;
  }

  .intro {
    text-align: center;
    color: #5f6368;
    line-height: 1.7;
    margin-bottom: 28px;
  }

  form {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px;
    border: 1px solid #dfe1e5;
    border-radius: 32px;
    box-shadow: 0 2px 8px #00000012;
    background: #fff;
  }

  form:focus-within {
    border-color: #4285f4;
    box-shadow: 0 2px 10px #4285f426;
  }

  input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    padding: 13px 15px;
    font-size: 16px;
  }

  form button {
    border: 0;
    border-radius: 25px;
    padding: 13px 19px;
    background: #1769e0;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  form button:hover {
    background: #0b57d0;
  }

  .topics {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 24px;
  }

  .topic {
    border: 1px solid #dadce0;
    background: #f8faff;
    color: #3c4043;
    border-radius: 22px;
    padding: 11px 15px;
    font-size: 14px;
    cursor: pointer;
  }

  .topic:hover {
    background: #e8f0fe;
    border-color: #c5d7fb;
  }

  #message {
    margin-top: 32px;
    padding: 20px;
    border: 1px solid #e0e5ee;
    border-radius: 18px;
    background: #f8faff;
    overflow-wrap: anywhere;
  }

  #message a {
    color: #1769e0;
    line-height: 1.8;
  }

  .hidden {
    display: none;
  }

  footer {
    text-align: center;
    padding: 45px 18px 25px;
    color: #70757a;
    font-size: 13px;
    line-height: 1.8;
  }

  @media (max-width: 480px) {
    main {
      margin-top: 55px;
      padding: 16px;
    }

    .logo {
      font-size: 27px;
    }

    form {
      gap: 3px;
    }

    input {
      padding: 12px 8px;
      font-size: 14px;
    }

    form button {
      padding: 12px;
      font-size: 14px;
    }

    .topic {
      padding: 10px 12px;
    }
  }
</style>
