
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b5ed7">
  <title>BharatKhoj AI — भारत की खोज</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f8ff;
      color: #17243b;
    }
    header {
      padding: 20px;
      text-align: center;
      background: white;
      border-bottom: 1px solid #e1e7f0;
    }
    .logo { font-size: 29px; font-weight: bold; color: #1458b5; }
    .logo span { color: #ef8d24; }
    header p { color: #63718a; margin-bottom: 0; }
    main {
      max-width: 720px;
      margin: 65px auto;
      padding: 20px;
      text-align: center;
    }
    h1 { font-size: 34px; margin-bottom: 10px; }
    .intro { color: #66758b; line-height: 1.6; }
    form {
      display: flex;
      margin-top: 28px;
      padding: 6px;
      background: white;
      border: 1px solid #d6dfed;
      border-radius: 18px;
      box-shadow: 0 8px 28px #173c7210;
    }
    input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      padding: 13px;
      font-size: 16px;
      background: transparent;
    }
    button {
      border: 0;
      border-radius: 12px;
      background: #1458b5;
      color: white;
      padding: 13px 18px;
      font-size: 16px;
      cursor: pointer;
    }
    .topics { margin-top: 24px; }
    .topic {
      display: inline-block;
      margin: 5px;
      padding: 9px 13px;
      background: white;
      border: 1px solid #dce4f0;
      border-radius: 22px;
      color: #344663;
      cursor: pointer;
    }
    #message {
      margin-top: 24px;
      padding: 15px;
      background: white;
      border-radius: 12px;
      line-height: 1.7;
      overflow-wrap: anywhere;
      text-align: left;
    }
    .hidden { display: none; }
    footer {
      text-align: center;
      padding: 20px;
      color: #718096;
      font-size: 13px;
    }
    @media (max-width: 480px) {
      main { margin-top: 35px; padding: 16px; }
      h1 { font-size: 28px; }
      form { gap: 4px; }
      input { padding: 10px 6px; font-size: 14px; }
      form button { padding: 10px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">🇮🇳 BharatKhoj <span>AI</span></div>
    <p>भारत की जानकारी, एक जगह</p>
  </header>

  <main>
    <h1>क्या खोजना चाहते हैं?</h1>
    <p class="intro">
      सवाल पूछिए और सही जानकारी के स्रोत खोजिए।
      हिंदी या English में शुरू करें।
    </p>

    <form id="searchForm">
      <input id="query" type="search"
        placeholder="यहाँ अपना सवाल लिखें..."
        aria-label="अपना सवाल लिखें" required>
      <button type="submit">खोजें 🔎</button>
    </form>

    <div class="topics">
      <button class="topic" type="button"
        data-q="भारत की सरकारी योजनाएँ">सरकारी योजनाएँ</button>
      <button class="topic" type="button"
        data-q="भारत में शिक्षा और छात्रवृत्ति">शिक्षा</button>
      <button class="topic" type="button"
        data-q="भारत में सरकारी नौकरियाँ">नौकरियाँ</button>
    </div>

    <section id="message" class="hidden" aria-live="polite"></section>
  </main>

  <footer>
    BharatKhoj AI · भारत के लिए बनाया जा रहा एक स्वतंत्र प्रोजेक्ट
    <br>प्रारंभिक संस्करण — परिणामों की पुष्टि मूल स्रोत से करें।
  </footer>

  <script>
    const form = document.getElementById('searchForm');
    const input = document.getElementById('query');
    const message = document.getElementById('message');

    function search(q) {
      const query = q.trim();
      if (!query) return;

      message.classList.remove('hidden');
      message.replaceChildren();

      const heading = document.createElement('h3');
      heading.textContent = 'आपकी खोज: ' + query;

      const note = document.createElement('p');
      note.textContent =
        'यह शुरुआती संस्करण है। अभी AI उत्तर और अपना सर्च इंडेक्स जुड़ा नहीं है।';

      const link = document.createElement('a');
link.href = 'https://www.google.com/search?q=' + encodeURIComponent(query + ' site:gov.in OR site:nic.in');
link.target = '_blank';
link.rel = 'noopener noreferrer';
link.textContent = 'भारतीय सरकारी स्रोतों में खोजें ↗';

      message.append(heading, note, link);
    }

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      search(input.value);
    });

    document.querySelectorAll('.topic').forEach(function(button) {
      button.addEventListener('click', function() {
        input.value = button.dataset.q;
        search(input.value);
      });
    });
  </script>
</body>
</html>
